<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup Page</title>
  <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
  <div class="login-box">
    <form id="loginForm">
        <h2>SIGN UP</h2>

        <div class="input-group">
          <input type="text" id="username" class="input-details">
          <label>Name</label>
        </div>

        <div class="input-group">
          <input type="email"  class="input-details" id="useremail" required >
          <label>Email</label>
        </div>

         <div class="input-group">
          <input type="password" class="input-details" id="password"  required>
          <label>Password</label>
        </div>

        <button type="submit" class="signup-btn" id="submitBtn">Sign Up</button>

        <p class="signup-link">
          Already Have an Account? <a href="index.html">Sign In</a>
        </p>
    </form>
  </div>

  <script src="newlogin.js"></script>
</body>
</html>
