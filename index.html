<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
  <div class="login-box">
    <form id="loginForm">
        <h2>LOGIN</h2>

        <div class="input-group">
          <input type="email" class="input-details" id="useremail" required>
          <label>Email</label>
        </div>

         <div class="input-group">
          <input type="password" class="input-details"  id="password" required>
          <label>Password</label>
        </div>

        <button type="submit" class="login-btn" id="submitBtn">Sign In</button>

        <p class="signup-link">
          New here? <a href="index1.html">Create Account</a>
        </p>
    </form>
  </div>

  <script src="newlogin.js"></script>
</body>
</html>
